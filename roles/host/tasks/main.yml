- name: Detect system architecture
  shell: "echo $(uname -m)/$(uname -p)"
  register: _arch_result
  changed_when: false

- name: Set arch fact
  set_fact:
    arch: "{{ _arch_result.stdout }}"

- name: Detect FreeBSD version
  shell: "uname -r"
  register: _freebsd_version_result
  changed_when: false

- name: Set FreeBSD version fact
  set_fact:
    poudriere_freebsd_version: "{{ _freebsd_version_result.stdout | regex_replace('-p[0-9]+$', '') }}"

- name: Disable resolvconf
  copy:
    content: "resolvconf=NO\n"
    dest: /etc/resolvconf.conf
    owner: root
    group: wheel
    mode: "0644"

- name: Set up resolv.conf
  template:
    src: etc_resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: wheel
    mode: "0644"

- name: Install packages
  package:
    name: "{{ pkg_name }}"
    state: present
  loop:
    - rsync
    - dma
    - jq
    - curl
    - bash
    - git
    - python312
    - python
    - fastfetch
    - vim
    - age
    - node_exporter
    - fd-find
    - poudriere
    - sanoid
    - py312-borgbackup
    - py312-borgmatic
  loop_control:
    loop_var: pkg_name

- name: Set up sshd
  template:
    src: etc_ssh_sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: wheel
    mode: "0644"
  notify: Restart sshd

- name: Start sshd
  service:
    name: sshd
    state: started

- name: Start syslogd
  service:
    name: syslogd
    state: started

- name: Start auditd
  service:
    name: auditd
    state: started

- name: Verify node_exporter supports FreeBSD device statistics
  command: /usr/local/bin/node_exporter --collector.devstat --help
  changed_when: false
  when: not ansible_check_mode

- name: Start or restart node_exporter
  service:
    name: node_exporter
    state: "{{ 'restarted' if _host_rc_conf is defined and _host_rc_conf.changed else 'started' }}"

- name: Verify node_exporter device statistics
  when: not ansible_check_mode
  block:
    - name: Check node_exporter devstat metrics
      uri:
        url: "http://{{ lan_ipv4_cidr | ipv4_host }}:9100/metrics"
        return_content: true
        status_code: 200
      register: _node_exporter_devstat
      until:
        - _node_exporter_devstat.status | default(0) == 200
        - (_node_exporter_devstat.content | default('')) is search('(?m)^node_scrape_collector_success\{collector="devstat"\} 1(?:\.0)?(?:\s|$)')
        - (_node_exporter_devstat.content | default('')) is search('(?m)^node_devstat_transfers_total\{')
      retries: 5
      delay: 2
      no_log: true
  rescue:
    - name: Report node_exporter device statistics failure
      fail:
        msg: >-
          node_exporter devstat verification failed.
          HTTP status: {{ _node_exporter_devstat.status | default('unavailable') }}.
          Request result: {{ _node_exporter_devstat.msg | default('unavailable') }}.
          Collector status: {{ (_node_exporter_devstat.content | default('') |
          regex_findall('(?m)^node_scrape_collector_success\{collector="devstat"\}[^\n]*') |
          first) | default('devstat is not enabled in the running exporter') }}.
          Device transfer counters present: {{ (_node_exporter_devstat.content | default(''))
          is search('(?m)^node_devstat_transfers_total\{') }}.
          If devstat is absent, verify node_exporter_args in rc.conf and restart node_exporter;
          if its collector status is 0, inspect the exporter logs for the collection error.

- name: Set up ZFS exporter
  include_tasks: zfs_exporter.yml

- name: Set up periodic.conf
  template:
    src: etc_periodic.conf.j2
    dest: /etc/periodic.conf
    owner: root
    group: wheel
    mode: "0644"

- name: Install .bashrc
  copy:
    src: root_bashrc
    dest: /root/.bashrc
    owner: root
    group: wheel
    mode: "0644"

# Jail infrastructure

- name: Ensure jail.conf.d exists
  file:
    path: /etc/jail.conf.d
    state: directory
    owner: root
    group: wheel
    mode: "0755"

- name: Find jail configuration files
  find:
    paths: /etc/jail.conf.d
    patterns: "*.conf"
    recurse: false
  register: _jail_conf_files

- name: Verify jail configuration scan succeeded
  assert:
    that: _jail_conf_files.skipped_paths | length == 0
    fail_msg: "Could not scan /etc/jail.conf.d: {{ _jail_conf_files.skipped_paths }}"
  when: not ansible_check_mode

- name: Identify extra jail configuration files
  set_fact:
    _extra_jail_conf_files: >-
      {{ _jail_conf_files.files | map(attribute='path') | list
         | difference(jails | map(attribute='name')
                      | map('regex_replace', '^(.*)$', '/etc/jail.conf.d/\1.conf') | list)
         | sort }}

- name: Review and remove extra jail configuration files
  when: _extra_jail_conf_files | length > 0
  block:
    - name: Report extra jail configuration files in check mode
      debug:
        var: _extra_jail_conf_files
      when: ansible_check_mode

    - name: Confirm deletion of extra jail configuration files
      pause:
        prompt: |
          These jail configuration files have no matching jail definition:
          {{ _extra_jail_conf_files | join('\n') }}

          Type yes to delete these files, or anything else to abort.
          Running jails and their datasets will not be removed.
      register: _jail_conf_cleanup_confirmation
      when: not ansible_check_mode

    - name: Require explicit confirmation for jail configuration cleanup
      assert:
        that: _jail_conf_cleanup_confirmation.user_input | default('') | trim | lower == 'yes'
        fail_msg: "Jail configuration cleanup aborted; no extra files were deleted."
      when: not ansible_check_mode

    - name: Delete extra jail configuration files
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _extra_jail_conf_files }}"
      when: not ansible_check_mode

# Ports tree management
- name: Deploy update-ports script
  template:
    src: usr_local_bin_update_ports.sh.j2
    dest: /usr/local/bin/update-ports
    owner: root
    group: wheel
    mode: "0755"

- name: Deploy jail_net script
  template:
    src: "{{ role_path }}/../jail/templates/usr_local_bin_jail_net.j2"
    dest: /usr/local/bin/jail_net
    owner: root
    group: wheel
    mode: "0755"

- name: Create base ZFS datasets
  community.general.zfs:
    name: "{{ item.name }}"
    state: present
    extra_zfs_properties:
      mountpoint: "{{ item.mountpoint | default(omit) }}"
      "com.borg:backup": "{{ item.backup | default(omit) }}"
  loop:
    - { name: "zroot", mountpoint: "/zroot", backup: true }
    - { name: "zroot/var/cache" }
    - { name: "zroot/jails", mountpoint: "/usr/local/jails" }
    - { name: "zroot/jails/media" }
    - { name: "zroot/jails/templates" }
    - { name: "zroot/jails/containers" }
    - { name: "zroot/jails/volumes", mountpoint: "/usr/local/jails/volumes" }
    - { name: "zroot/ports", mountpoint: "/usr/ports" }
    - { name: "zroot/borg/config", mountpoint: "/usr/local/etc/borg", backup: false }
    - { name: "zroot/storage", mountpoint: "/usr/local/jails/volumes/storage", backup: false }
  loop_control:
    label: "{{ item.name }}"

- name: Create storage group
  group:
    name: storage
    gid: 1001

- name: Create storage user
  user:
    name: storage
    uid: 1001
    group: storage
    home: /nonexistent
    shell: /usr/sbin/nologin
    create_home: false

- name: Set storage volume permissions
  file:
    path: /usr/local/jails/volumes/storage
    state: directory
    owner: storage
    group: storage
    mode: "0777"

- name: Create storage directories
  file:
    path: "/usr/local/jails/volumes/storage/{{ item.name }}"
    state: directory
    owner: "1001"
    group: "1001"
    mode: "{{ item.mode }}"
  loop:
    - { name: media, mode: "0777" }
    - { name: docs, mode: "0775" }
    - { name: downloads, mode: "0777" }
    - { name: projects-ableton, mode: "0755" }
    - { name: vault, mode: "0755" }
    - { name: jan-systems-2025-content, mode: "0755" }

- name: Set up pkgbase jail template
  include_tasks: jail_template.yml

- name: Deploy /etc/jail.conf
  template:
    src: jail.conf.j2
    dest: /etc/jail.conf
    owner: root
    group: wheel
    mode: "0644"

- name: Deploy devfs.rules
  template:
    src: devfs.rules.j2
    dest: /etc/devfs.rules
    owner: root
    group: wheel
    mode: "0644"

- name: Set up crontab
  template:
    src: etc_crontab.j2
    dest: /etc/crontab
    owner: root
    group: wheel
    mode: "0644"
  notify: Restart cron

# Ports trees and forge
- name: Check if quarterly ports tree exists
  stat:
    path: /usr/ports/quarterly/Mk
  register: _quarterly_exists

- name: Download quarterly ports tree
  shell: /usr/local/bin/update-ports quarterly
  when: not _quarterly_exists.stat.exists

- name: Check if custom ports overlay exists
  shell: "ls /usr/ports/custom/ 2>/dev/null | head -1"
  register: _custom_exists
  changed_when: false

- name: Check if forge git server is reachable
  wait_for:
    host: "{{ jail_ips.forge }}"
    port: 80
    timeout: 5
  when: _custom_exists.stdout == ""
  register: _forge_reachable
  ignore_errors: true

- name: "*** FORGE NOT READY ***"
  fail:
    msg: |
      ════════════════════════════════════════════════════════════════
        FORGE JAIL NOT READY
      ════════════════════════════════════════════════════════════════
        The custom ports overlay is cloned from the forge jail's git
        server ({{ jail_ips.forge }}), but forge is not reachable.

        Set up the forge jail using its jail role, and try again.
      ════════════════════════════════════════════════════════════════
  when: _custom_exists.stdout == "" and _forge_reachable is failed

- name: Download custom ports overlay
  shell: /usr/local/bin/update-ports custom
  when: _custom_exists.stdout == ""

- name: Set up poudriere
  include_tasks: poudriere.yml

# Repo validation gate
- name: Check if poudriere repo has packages
  stat:
    path: "/usr/local/poudriere/data/packages/poudriere_build-quarterly/meta"
  register: _poudriere_repo

- name: "*** POUDRIERE REPO NOT READY ***"
  fail:
    msg: |
      ════════════════════════════════════════════════════════════════
        POUDRIERE REPOSITORY NOT READY
      ════════════════════════════════════════════════════════════════
        The local package repository has not been built yet.
        Run the following command on the host to build packages:

          poudriere-start-build

        Then re-run this playbook.
      ════════════════════════════════════════════════════════════════
  when: not _poudriere_repo.stat.exists

- name: Install custom packages from poudriere
  shell: "pkg install -y -r poudriere pylogsentinel"
  register: _custom_pkg
  changed_when: "'Number of packages to be installed' in _custom_pkg.stdout"

- name: Deploy pylogsentinel.conf
  template:
    src: usr_local_etc_pylogsentinel.conf.j2
    dest: /usr/local/etc/pylogsentinel.conf
    owner: root
    group: wheel
    mode: "0644"

- name: Deploy pylogsentinel-batch-email.sh
  template:
    src: usr_local_bin_pylogsentinel-batch-email.sh.j2
    dest: /usr/local/bin/pylogsentinel-batch-email.sh
    owner: root
    group: wheel
    mode: "0755"
