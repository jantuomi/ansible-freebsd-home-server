userland: "15.0-RELEASE"

zfs:
  - name: zroot/jails/volumes/komga_data
    mountpoint: /var/db/komga

nullfs:
  - src: /usr/local/jails/volumes/storage/media/manga
    dst: /mnt/manga

pkg:
  - openjdk25-jre-headless
  - poppler-utils
  - zip

dirs:
  - /usr/local/etc/rc.d # no packages to set this up automatically
  - /usr/local/komga

services:
  - komga
