userland: "15.1-RELEASE"

zfs:
  - name: zroot/jails/volumes/homepage_www
    mountpoint: /var/www

pkg:
  - pcre2
  - nginx
  - rsync
  - bash

files:
  - src: usr_local_etc_nginx_nginx.conf.j2
    dest: /usr/local/etc/nginx/nginx.conf
  - src: etc_crontab.j2
    dest: /etc/crontab

services:
  - nginx
