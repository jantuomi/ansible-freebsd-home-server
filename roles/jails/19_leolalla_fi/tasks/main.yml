- import_role:
    name: jail
    tasks_from: jail_setup

- name: Install gdrive-photo-gallery from port
  shell: cd /usr/ports/www/gdrive-photo-gallery && make install BATCH=yes WRKDIRPREFIX=/tmp/ports DISTDIR=/tmp/distfiles
  register: _gallery_install
  failed_when: "_gallery_install.rc != 0 and 'already installed' not in _gallery_install.stdout"
  changed_when: "'already installed' not in _gallery_install.stdout"

- name: Deploy environment file
  template:
    src: "{{ jail_role_dir }}/templates/gdrive_photo_gallery.env.j2"
    dest: /usr/local/etc/gdrive-photo-gallery.env
    owner: root
    group: wheel
    mode: "0600"
  no_log: true

- name: Deploy wrapper script
  template:
    src: "{{ jail_role_dir }}/templates/usr_local_bin_gdrive_photo_gallery"
    dest: /usr/local/bin/gdrive-photo-gallery
    owner: root
    group: wheel
    mode: "0755"

- import_role:
    name: jail
    tasks_from: jail_launch
