- import_role:
    name: jail
    tasks_from: jail_setup

- name: Deploy environment file
  template:
    src: "{{ jail_role_dir }}/templates/gdrive_photo_gallery.env.j2"
    dest: /usr/local/etc/gdrive-photo-gallery.env
    owner: root
    group: wheel
    mode: "0600"
  no_log: true

- import_role:
    name: jail
    tasks_from: jail_launch
