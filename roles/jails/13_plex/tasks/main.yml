- import_role:
    name: jail
    tasks_from: jail_setup

- name: Install plexmediaserver from port
  shell: cd /usr/ports/multimedia/plexmediaserver && make install BATCH=yes WRKDIRPREFIX=/tmp/ports DISTDIR=/tmp/distfiles
  register: _plex_install
  failed_when: "_plex_install.rc != 0 and 'already installed' not in _plex_install.stdout"
  changed_when: "'already installed' not in _plex_install.stdout"

- import_role:
    name: jail
    tasks_from: jail_launch
