userland: "15.1-minimal-jail"

forge_page_rate: "5r/s"
forge_page_burst: 50

zfs:
  - name: forge_repos
    owner: "1000"
    group: "1000"
    mode: "0755"
  # SSH host keys live on a volume so they survive jail recreation;
  # otherwise every userland migration changes the server's identity.
  - name: forge_ssh_hostkeys
    mode: "0700"
  - name: forge_iocaine
    owner: "1001"
    group: "1001"
    mode: "0700"

nullfs:
  - src: forge_repos
    dst: /var/db/repos
  - src: forge_ssh_hostkeys
    dst: /var/db/ssh_hostkeys
  - src: forge_iocaine
    dst: /var/db/iocaine

dirs:
  - /var/db/ssh_hostkeys
  - /var/db/iocaine

pkg:
  - FreeBSD-ssh
  - git
  - cgit
  - fcgiwrap
  - nginx
  - iocaine
  - highlight
  - py312-docutils
  - py312-markdown
  - py312-pygments
  - groff

services:
  - sshd
  - iocaine
  - nginx
  - fcgiwrap
  - cron

rc_conf: |
  fcgiwrap_socket_owner="www"
  fcgiwrap_socket_group="www"
  fcgiwrap_user="www"
  fcgiwrap_group="www"
  iocaine_user="iocaine"
  iocaine_group="iocaine"
