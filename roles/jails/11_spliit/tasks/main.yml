- import_role:
    name: jail
    tasks_from: jail_setup

- name: Install expense-tracker from port
  shell: cd /usr/ports/www/expense-tracker && make install WRKDIRPREFIX=/tmp/ports DISTDIR=/tmp/distfiles
  register: _spliit_install
  failed_when: "_spliit_install.rc != 0 and 'already installed' not in _spliit_install.stdout"
  changed_when: "'already installed' not in _spliit_install.stdout"

- name: Configure expense_tracker
  community.general.sysrc:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - { name: expense_tracker_base_url, value: "https://spliit.jan.systems" }
    - { name: expense_tracker_port, value: "80" }

- import_role:
    name: jail
    tasks_from: jail_launch
