- import_role:
    name: jail
    tasks_from: jail_setup

- name: Configure expense_tracker
  community.general.sysrc:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - { name: expense_tracker_base_url, value: "https://spliit.jan.systems" }
    - { name: expense_tracker_port, value: "80" }

- import_role:
    name: jail
    tasks_from: jail_launch
