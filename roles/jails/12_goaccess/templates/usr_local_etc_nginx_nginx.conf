worker_processes 1;

events {
    worker_connections 128;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;

        root /var/db/goaccess/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
