worker_processes 1;

events {
    worker_connections 128;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;

        root /mnt/poudriere-html;
        index index.html;

        location /data {
            alias /mnt/poudriere-logs/bulk;
            autoindex on;
        }

        location /packages {
            alias /mnt/poudriere-packages/poudriere_build-quarterly/.latest;
            autoindex on;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
