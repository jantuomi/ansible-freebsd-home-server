- import_role:
    name: jail
    tasks_from: jail_setup

- name: Install pastebin from port
  shell: cd /usr/ports/www/pastebin && make install BATCH=yes WRKDIRPREFIX=/tmp/ports DISTDIR=/tmp/distfiles
  register: _paste_install
  failed_when: "_paste_install.rc != 0 and 'already installed' not in _paste_install.stdout"
  changed_when: "'already installed' not in _paste_install.stdout"

- import_role:
    name: jail
    tasks_from: jail_launch
