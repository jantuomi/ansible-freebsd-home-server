- import_role:
    name: jail
    tasks_from: jail_setup

- name: Install taulubot
  shell: pkg install -y -r poudriere taulubot
  register: _taulubot_install
  changed_when: "'Installing' in _taulubot_install.stdout"

- name: Deploy bot token file
  copy:
    content: "{{ taulubot_token }}"
    dest: /usr/local/etc/taulubot.token
    owner: root
    group: wheel
    mode: "0600"
  no_log: true

- import_role:
    name: jail
    tasks_from: jail_launch
