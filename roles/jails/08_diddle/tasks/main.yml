- import_role:
    name: jail
    tasks_from: jail_setup

- name: Install diddle
  shell: pkg install -y -r poudriere diddle
  register: _diddle_install
  changed_when: "'Installing' in _diddle_install.stdout"

- name: Deploy diddle env file
  template:
    src: "{{ jail_role_dir }}/templates/diddle.env.j2"
    dest: /usr/local/etc/diddle.env
    owner: root
    group: wheel
    mode: "0600"
  notify: Restart diddle

- name: Bind diddle to port 80
  community.general.sysrc:
    name: diddle_bind
    value: "0.0.0.0:80"

- import_role:
    name: jail
    tasks_from: jail_launch
