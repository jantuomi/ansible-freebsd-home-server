userland: "15.0-RELEASE"

zfs:
  - name: zroot/jails/volumes/freshrss_data
    mountpoint: /usr/local/FreshRSS/data

pkg:
  - nginx
  - php82
  - php82-ctype
  - php82-curl
  - php82-dom
  - php82-filter
  - php82-gd
  - php82-iconv
  - php82-mbstring
  - php82-opcache
  - php82-pdo
  - php82-pdo_sqlite
  - php82-phar
  - php82-posix
  - php82-session
  - php82-simplexml
  - php82-sqlite3
  - php82-tokenizer
  - php82-xml
  - php82-xmlreader
  - php82-xmlwriter
  - php82-zip
  - php82-extensions

files:
  - src: usr_local_etc_nginx_nginx.conf
    dest: /usr/local/etc/nginx/nginx.conf
  - src: usr_local_etc_php_fpm.d_www.conf
    dest: /usr/local/etc/php-fpm.d/www.conf

services:
  - nginx
  - php_fpm
