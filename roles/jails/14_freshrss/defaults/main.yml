userland: "15.1-RELEASE"

zfs:
  - name: freshrss_data
    owner: "80"
    group: "80"

nullfs:
  - src: freshrss_data
    dst: /var/db/freshrss

pkg:
  - nginx

pkg_custom:
  - freshrss-php84

files:
  - src: usr_local_etc_nginx_nginx.conf
    dest: /usr/local/etc/nginx/nginx.conf
  - src: usr_local_etc_php_fpm.d_www.conf
    dest: /usr/local/etc/php-fpm.d/www.conf
  - src: etc_crontab
    dest: /etc/crontab

services:
  - nginx
  - php_fpm
