# Restart a jail (runs on the jail host) so a new jail.conf takes effect.
# Usage from a jail role:
#   - import_role: { name: jail, tasks_from: jail_restart }
#
# A VNET jail lingers in "dying" state after stop; starting before it is gone
# fails with "already exists", so wait for it.

- name: "Stop {{ jail_name }} jail"
  shell: "service jail stop {{ jail_name }} || true"
  delegate_to: "{{ jail_delegate_host }}"

- name: "Wait until {{ jail_name }} jail is gone"
  shell: "jls -dj {{ jail_name }} jid"
  register: _jail_dying
  failed_when: false
  changed_when: false
  until: _jail_dying.rc != 0
  retries: 30
  delay: 3
  delegate_to: "{{ jail_delegate_host }}"

- name: "Assert {{ jail_name }} jail is gone"
  assert:
    that: _jail_dying.rc != 0
    fail_msg: "Jail {{ jail_name }} is still dying. Check 'jls -d' on the host."

# jail stop only unmounts what the *current* jail.conf lists. If the config
# was changed before the stop, mounts from the old config survive; a stopped
# jail must have nothing mounted under its path, so unmount leftovers.
- name: "Unmount any remaining mounts inside {{ jail_name }} container"
  shell: |
    mount | awk '$3 ~ "^/usr/local/jails/containers/{{ jail_name }}/" {print $3}' | sort -r | xargs -I{} umount -f {} 2>/dev/null || true
  changed_when: false
  delegate_to: "{{ jail_delegate_host }}"

- name: "Start {{ jail_name }} jail"
  shell: "service jail start {{ jail_name }}"
  delegate_to: "{{ jail_delegate_host }}"

- name: "Verify {{ jail_name }} jail is running"
  shell: "jls -j {{ jail_name }} jid"
  changed_when: false
  delegate_to: "{{ jail_delegate_host }}"
